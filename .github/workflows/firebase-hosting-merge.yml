name: Deploy Firebase production on merge
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ANIQSAIDI }}
      - run: npm ci
      
      - name: Install Firebase Functions dependencies
        run: npm ci
        working-directory: functions
      
      - run: npm run deploy:prod
